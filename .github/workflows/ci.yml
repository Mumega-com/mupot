name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Dependency audit, split by what actually ships.
      #
      # This step used to be a single `npm audit --audit-level=high` over prod AND dev.
      # As of 2026-08-04 that is UNSATISFIABLE, not merely noisy: undici has open highs,
      # reachable only as wrangler → miniflare → undici, and there is no wrangler version
      # without it. `npm audit fix --force` "resolves" it by DOWNGRADING wrangler to
      # 4.35.0 from 4.118 — surrendering ~80 releases of fixes to silence a dev-only
      # finding. So the single gate had one of two outcomes: permanently red, or a
      # downgrade that makes us less safe. Neither is a gate; both are theatre.
      #
      # The split below is STRICTER on what ships, not weaker. Production drops from
      # --audit-level=high to MODERATE, and it currently reports 0 vulnerabilities at
      # any level, so this blocks on the first regression rather than waiting for one
      # to reach "high". It would still have caught every real finding this gate has
      # ever caught (fast-uri, ip-address, brace-expansion — all production).
      #
      # PRECEDENT, recorded because it is the reason to distrust this change: PR #664
      # was an earlier attempt to relax this gate, retracted the same day. It was wrong
      # because the premise came from a STALE LOCAL node_modules that showed dev-only
      # advisories while CI's clean `npm ci` had 5 production highs. The premise here
      # was taken from the LOCKFILE (`npm audit --package-lock-only --omit=dev`), which
      # is what CI installs from, and the production highs it found were FIXED rather
      # than reclassified — see the overrides block in package.json.
      - name: Dependency audit (production — BLOCKING)
        run: npm audit --omit=dev --audit-level=moderate
      # Dev/build-tooling advisories. Real supply-chain exposure to a compromised build
      # host, but not shippable surface, and currently unfixable at any version. Reported
      # so a human sees it every run; non-blocking so it cannot force the downgrade above.
      # Re-run WITHOUT `|| true` whenever wrangler publishes a miniflare bump — the day
      # this passes on its own, delete the `|| true` and fold it back into the blocking
      # step. Tracked: https://github.com/Mumega-com/mupot/issues/670
      - name: Dependency audit (dev toolchain — report only)
        run: npm audit --audit-level=high || true
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright browser for integration tests
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Fleet runtime tests
        run: node --test fleet-runtime/*.test.mjs
      - name: Wrangler dry-run bundle check
        run: npx wrangler deploy --dry-run --config wrangler.example.toml
      - name: D1 migration chain check
        run: |
          tmp_db="$(mktemp)"
          trap 'rm -f "$tmp_db"' EXIT
          for migration in migrations/*.sql; do
            sqlite3 "$tmp_db" < "$migration"
          done

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plugin test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Compile plugin
        run: python -m compileall -q plugin
      - name: Plugin tests
        run: python -m pytest plugin/tests

  local-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Local browser and runtime evidence
        run: bash scripts/ci-local-evidence.sh
      - name: Upload local evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-evidence
          path: |
            tmp/local-evidence
            tmp/local-smoke
            tmp/local-runtime-conformance
            tmp/local-project-routine

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard — no secrets in this public template
        run: node scripts/no-secrets.mjs

  design-status-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard — design status only in design-only contracts
        run: node scripts/design-status-contract-policy.mjs
