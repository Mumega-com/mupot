name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Blocking gate: PRODUCTION dependencies only.
      #
      # A Worker ships only production deps. Every high advisory on 2026-08-03 was
      # in build tooling — undici via miniflare via wrangler, postcss via vite —
      # none of which reaches a running Worker or a customer.
      #
      # The previous `npm audit --audit-level=high` failed on the whole tree, so a
      # newly published advisory in any transitive dev dep turned EVERY branch red
      # without a line of code changing. That happened twice (#464 fast-uri, #662
      # undici/postcss) and it stopped the entire merge queue — including a PR
      # closing a live production exposure. A required check that fails on a clock
      # rather than on the diff teaches people to reach for the override, which is
      # how a real red gets waved through.
      #
      # So: block on what ships, report on what doesn't.
      - name: Dependency audit (production deps — blocking)
        run: npm audit --audit-level=high --omit=dev
      # Non-blocking: dev-dep advisories stay VISIBLE. They are real supply-chain
      # signal for the build host even though they never reach production, and
      # silencing them entirely would trade one blind spot for another.
      - name: Dependency audit (dev deps — informational)
        run: npm audit --audit-level=high || echo "::warning::dev-dependency advisories present — see log; non-blocking, they do not ship to the Worker"
        continue-on-error: true
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright browser for integration tests
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Fleet runtime tests
        run: node --test fleet-runtime/*.test.mjs
      - name: Wrangler dry-run bundle check
        run: npx wrangler deploy --dry-run --config wrangler.example.toml
      - name: D1 migration chain check
        run: |
          tmp_db="$(mktemp)"
          trap 'rm -f "$tmp_db"' EXIT
          for migration in migrations/*.sql; do
            sqlite3 "$tmp_db" < "$migration"
          done

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plugin test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Compile plugin
        run: python -m compileall -q plugin
      - name: Plugin tests
        run: python -m pytest plugin/tests

  local-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Local browser and runtime evidence
        run: bash scripts/ci-local-evidence.sh
      - name: Upload local evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-evidence
          path: |
            tmp/local-evidence
            tmp/local-smoke
            tmp/local-runtime-conformance
            tmp/local-project-routine

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard — no secrets in this public template
        run: node scripts/no-secrets.mjs

  design-status-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard — design status only in design-only contracts
        run: node scripts/design-status-contract-policy.mjs
