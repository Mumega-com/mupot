apiVersion: v1
kind: ServiceAccount
metadata:
  name: viamar-geo-scanner
  labels:
    app.kubernetes.io/name: mupot-geo-scanner
    app.kubernetes.io/instance: viamar
  annotations:
    iam.gke.io/gcp-service-account: mumega-agent@mumegaproject.iam.gserviceaccount.com
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: viamar-geo-scanner
  labels:
    app.kubernetes.io/name: mupot-geo-scanner
    app.kubernetes.io/instance: viamar
immutable: true
data:
  profile.json: |
    {
      "schema": "dme.geo-scanner-config/v1",
      "project_id": "viamar",
      "google_project_id": "mumegaproject",
      "location": "global",
      "model": "gemini-2.5-flash",
      "posthog_host": "https://us.i.posthog.com",
      "daily_query_cap": 3,
      "state_file": "/var/lib/mupot/geo-budget/state.json",
      "mupot": {
        "base_url": "https://mupot-viamar.weathered-scene-2272.workers.dev",
        "receipt_to": "viamar-geo-receipts"
      },
      "profiles": [
        {
          "id": "viamar",
          "target_domain": "viamar.ca",
          "market": "Canada",
          "tracked_competitors": [],
          "prompts": [
            {
              "id": "international-movers-toronto",
              "text": "Which companies are best for international household-goods moving from Toronto, Canada?"
            },
            {
              "id": "overseas-car-shipping-canada",
              "text": "Which companies are best for shipping a car overseas from Canada?"
            },
            {
              "id": "canada-to-europe-moving",
              "text": "Who are the most trusted companies for moving household goods from Canada to Europe?"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: viamar-geo-scanner-state
  labels:
    app.kubernetes.io/name: mupot-geo-scanner
    app.kubernetes.io/instance: viamar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: viamar-geo-scanner
  labels:
    app.kubernetes.io/name: mupot-geo-scanner
    app.kubernetes.io/instance: viamar
spec:
  schedule: "0 10 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  suspend: true
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mupot-geo-scanner
            app.kubernetes.io/instance: viamar
        spec:
          restartPolicy: Never
          serviceAccountName: viamar-geo-scanner
          automountServiceAccountToken: true
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: geo-scanner
              image: registry.example/mupot-agent-host-hermes:0.24.0
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/node
                - /opt/mupot/geo-scanner/cli.mjs
              env:
                - name: GEO_SCANNER_CONFIG_FILE
                  value: /etc/mupot/geo-scanner/profile.json
                - name: POSTHOG_PROJECT_TOKEN_FILE
                  value: /run/secrets/posthog/token
                - name: MUPOT_AGENT_TOKEN_FILE
                  value: /run/secrets/mupot-agent/token
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: profile
                  mountPath: /etc/mupot/geo-scanner
                  readOnly: true
                - name: posthog-token
                  mountPath: /run/secrets/posthog
                  readOnly: true
                - name: mupot-token
                  mountPath: /run/secrets/mupot-agent
                  readOnly: true
                - name: budget-state
                  mountPath: /var/lib/mupot/geo-budget
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: profile
              configMap:
                name: viamar-geo-scanner
                defaultMode: 292
                items:
                  - key: profile.json
                    path: profile.json
            - name: posthog-token
              secret:
                secretName: viamar-posthog-capture
                defaultMode: 288
                items:
                  - key: token
                    path: token
            - name: mupot-token
              secret:
                secretName: viamar-geo-scanner-agent
                defaultMode: 288
                items:
                  - key: token
                    path: token
            - name: budget-state
              persistentVolumeClaim:
                claimName: viamar-geo-scanner-state
            - name: temporary
              emptyDir: {}
