# Kubernetes ServiceAccount bound to a GCP ServiceAccount via Workload
# Identity Federation for GKE. No JSON key file, no long-lived credential
# in the cluster at all — the node's metadata-concealment proxy exchanges
# this KSA's identity for a short-lived GSA access token on request.
#
# The GSA (created out-of-band, NOT by kubectl apply — see COMMANDS.md
# step 6) must be granted:
#   roles/secretmanager.secretAccessor
# scoped to ONLY the two secrets this service reads (conditional IAM
# binding or per-secret IAM policy — NOT a project-wide grant).
#
# automountServiceAccountToken is intentionally left at its default (true)
# here — Workload Identity's token exchange depends on the projected KSA
# token being present. (Contrast with deploy/kubernetes/agent-host/*, which
# sets automountServiceAccountToken: false because that runtime authenticates
# with a static mounted Secret file instead, not Workload Identity.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dme-hermes-relay
  namespace: dme-hermes
  annotations:
    iam.gke.io/gcp-service-account: dme-hermes-relay@mumegaproject.iam.gserviceaccount.com
