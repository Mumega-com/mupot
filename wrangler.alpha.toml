# wrangler.alpha.toml — GENERATED by mupot_provision v0.1
# DO NOT COMMIT with real IDs if this file is in a public repo.
# Treat cf_api_token as a secret: set via `wrangler secret put` or env, never here.
name = "mupot-alpha"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
[build]
command = "node scripts/generate-build-info.mjs"

[vars]
TENANT_SLUG = "alpha"
BRAND = "Alpha"
OAUTH_PROVIDER = "google"
FLEET_PROJECT = "sos"
FLEET_OPS_AGENT = "kasra"

[[d1_databases]]
binding = "DB"
database_name = "mupot-alpha"
database_id = "existing-d1"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "fake-kv-0001"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "fake-kv-0002"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentDO"

[[durable_objects.bindings]]
name = "SQUAD"
class_name = "SquadCoordinatorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDO", "SquadCoordinatorDO"]

[[workflows]]
name = "mupot-task-workflow"
binding = "TASK_WORKFLOW"
class_name = "TaskWorkflow"

[triggers]
crons = ["*/15 * * * *"]
