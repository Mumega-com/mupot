repo: servathadi/dnu
branch: main
url: https://dentalnearyou.ca

# Squad routing
squads:
  seo: true
  dev: true
  outreach: true
  content: true

# Channels
channels:
  - type: discord
    agent: dandan
  - type: redis
    target_agent: dandan

# Content
content:
  schedule: "0 8 * * *"
  types: [dental_tips, cdcp_updates, city_guides]
  engine: gemini-flash

# Revenue
revenue:
  track: true
  model: lead_gen
  kpis: [organic_traffic, keyword_rankings, pages_indexed, partner_clinics]

# Pipeline
pipeline:
  build_cmd: "npm run build"
  test_cmd: "npx tsc --noEmit"
  deploy_cmd: "git push origin main"
  smoke_cmd: "curl -sf https://dentalnearyou.ca/en/ > /dev/null"
  deploy_mode: manual

# Market
cities: [Toronto, Vancouver, Calgary, Edmonton, Ottawa, Mississauga, Hamilton, Winnipeg, Montreal, Quebec City]
primary_keywords:
  - "dentist [city]"
  - "emergency dentist [city]"
  - "dentist accepting new patients [city]"

