[package]
name = "mupot-hostd"
version = "0.1.0"
edition = "2024"
description = "Local Mupot host memory freshness broker (contracts only in Flight 1)"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
